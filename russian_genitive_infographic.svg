  <!-- Header text -->
  <rect x="171" y="69" width="653" height="247" rx="17" class="panel"/>
  <text x="205" y="135" class="title">Russisch: 2. Fall</text>
  <text x="205" y="184" class="subtitle">Genitiv · родительный падеж</text>
  <text x="205" y="230" class="body">Fragen: <tspan class="ru">кого?</tspan> / <tspan class="ru">чего?</tspan></text>
  <text x="205" y="270" class="small">Deutsch: oft „wessen?“, „von wem?“, „wovon?“</text>

  <!-- Main table -->
  <rect x="76" y="372" width="872" height="540" rx="19" class="panel"/>
  <rect x="96" y="397" width="832" height="55" rx="9" fill="#e8f1fb" stroke="#adc5df" stroke-width="1.2"/>
  <line x1="221" y1="397" x2="221" y2="892" class="gridline"/>
  <line x1="390" y1="397" x2="390" y2="892" class="gridline"/>
  <line x1="550" y1="397" x2="550" y2="892" class="gridline"/>
  <line x1="96" y1="452" x2="928" y2="452" class="gridline"/>
  <line x1="96" y1="512" x2="928" y2="512" class="gridline"/>
  <line x1="96" y1="572" x2="928" y2="572" class="gridline"/>
  <line x1="96" y1="632" x2="928" y2="632" class="gridline"/>
  <line x1="96" y1="692" x2="928" y2="692" class="gridline"/>
  <line x1="96" y1="752" x2="928" y2="752" class="gridline"/>
  <line x1="96" y1="812" x2="928" y2="812" class="gridline"/>
  <line x1="96" y1="892" x2="928" y2="892" class="gridline"/>

  <text x="106" y="433" class="table-head">Geschlecht</text>
  <text x="236" y="433" class="table-head">Nominativ</text>
  <text x="405" y="433" class="table-head">Genitiv</text>
  <text x="565" y="433" class="table-head">Beispiele</text>

  <text x="106" y="491" class="table-text">männlich</text>
  <text x="236" y="491" class="table-text">Konsonant</text>
  <text x="405" y="491" class="table-strong">→ -а</text>
  <text x="565" y="491" class="table-text"><tspan class="ru">стол</tspan> → <tspan class="ru">стола</tspan>; <tspan class="ru">студент</tspan> → <tspan class="ru">студента</tspan></text>

  <text x="106" y="551" class="table-text">männlich</text>
  <text x="236" y="551" class="table-text">-й / -ь</text>
  <text x="405" y="551" class="table-strong">→ -я</text>
  <text x="565" y="551" class="table-text"><tspan class="ru">музей</tspan> → <tspan class="ru">музея</tspan>; <tspan class="ru">словарь</tspan> → <tspan class="ru">словаря</tspan></text>

  <text x="106" y="611" class="table-text">neutral</text>
  <text x="236" y="611" class="table-text">-о</text>
  <text x="405" y="611" class="table-strong">→ -а</text>
  <text x="565" y="611" class="table-text"><tspan class="ru">окно</tspan> → <tspan class="ru">окна</tspan>; <tspan class="ru">письмо</tspan> → <tspan class="ru">письма</tspan></text>

  <text x="106" y="671" class="table-text">neutral</text>
  <text x="236" y="671" class="table-text">-е / -ё</text>
  <text x="405" y="671" class="table-strong">→ -я</text>
  <text x="565" y="671" class="table-text"><tspan class="ru">море</tspan> → <tspan class="ru">моря</tspan>; <tspan class="ru">жильё</tspan> → <tspan class="ru">жилья</tspan></text>

  <text x="106" y="731" class="table-text">feminin</text>
  <text x="236" y="731" class="table-text">-а</text>
  <text x="405" y="731" class="table-strong">→ -ы</text>
  <text x="565" y="731" class="table-text"><tspan class="ru">мама</tspan> → <tspan class="ru">мамы</tspan>; <tspan class="ru">страна</tspan> → <tspan class="ru">страны</tspan></text>

  <text x="106" y="791" class="table-text">feminin</text>
  <text x="236" y="791" class="table-text">-я / -ь</text>
  <text x="405" y="791" class="table-strong">→ -и</text>
  <text x="565" y="791" class="table-text"><tspan class="ru">неделя</tspan> → <tspan class="ru">недели</tspan>; <tspan class="ru">ночь</tspan> → <tspan class="ru">ночи</tspan></text>

  <text x="106" y="851" class="table-text">feminin</text>
  <text x="236" y="851" class="table-text">-а nach г к х ж ч ш щ</text>
  <text x="405" y="851" class="table-strong">→ -и</text>
  <text x="565" y="851" class="table-text"><tspan class="ru">книга</tspan> → <tspan class="ru">книги</tspan>; <tspan class="ru">дача</tspan> → <tspan class="ru">дачи</tspan></text>

  <text x="97" y="885" class="tiny">Merke: Nach г, к, х, ж, ч, ш, щ schreibt man -и, nicht -ы. Hier geht es um den Genitiv Singular.</text>

  <!-- Usage examples -->
  <rect x="75" y="937" width="884" height="330" rx="18" class="panel"/>
  <text x="109" y="997" class="section-title">Wann benutzt man den Genitiv?</text>

  <rect x="111" y="1027" width="64" height="30" rx="15" class="chip"/>
  <text x="131" y="1049" class="label">1</text>
  <text x="190" y="1050" class="small"><tspan font-weight="800">Besitz / Zugehörigkeit:</tspan> <tspan class="ru">книга студента</tspan> = das Buch des Studenten</text>

  <rect x="111" y="1072" width="64" height="30" rx="15" class="redchip"/>
  <text x="131" y="1094" class="label">2</text>
  <text x="190" y="1095" class="small"><tspan font-weight="800">Verneinung mit нет:</tspan> <tspan class="ru">У меня нет времени.</tspan> = Ich habe keine Zeit.</text>

  <rect x="111" y="1117" width="64" height="30" rx="15" class="chip"/>
  <text x="131" y="1139" class="label">3</text>
  <text x="190" y="1140" class="small"><tspan font-weight="800">Mengen und Zahlen:</tspan> <tspan class="ru">много книг</tspan> = viele Bücher; <tspan class="ru">два часа</tspan> = zwei Stunden</text>

  <rect x="111" y="1162" width="64" height="30" rx="15" class="redchip"/>
  <text x="131" y="1184" class="label">4</text>
  <text x="190" y="1185" class="small"><tspan font-weight="800">Herkunft / weg von:</tspan> <tspan class="ru">из Москвы</tspan> = aus Moskau; <tspan class="ru">от брата</tspan> = vom Bruder</text>

  <rect x="111" y="1207" width="64" height="30" rx="15" class="chip"/>
  <text x="131" y="1229" class="label">5</text>
  <text x="190" y="1230" class="small"><tspan font-weight="800">Nach Präpositionen:</tspan> <tspan class="ru">без сахара</tspan> = ohne Zucker; <tspan class="ru">для Анны</tspan> = für Anna</text>

  <!-- Notes -->
  <rect x="63" y="1314" width="898" height="144" rx="15" class="panel"/>
  <text x="96" y="1360" class="section-title">Extra-Hinweis</text>
  <text x="96" y="1399" class="small">Bei belebten männlichen Substantiven sieht der Akkusativ wie der Genitiv aus:</text>
  <text x="96" y="1434" class="small"><tspan class="ru">Я вижу студента.</tspan> = Ich sehe den Studenten.  ·  Im Plural gibt es eigene Genitiv-Endungen.</text>
</svg>
